<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  connect-src 'self' 
    https://*.firebaseio.com 
    https://*.googleapis.com 
    https://*.gstatic.com
    wss://*.firebaseio.com;
  script-src 'self' 
    https://*.firebaseio.com 
    https://*.googleapis.com 
    https://*.gstatic.com 
    'unsafe-inline';
  style-src 'self' 'unsafe-inline';
">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Figtree:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="login-style.css">
</head>

<body>


    <!-- ═══════════════ AUTH PAGE ═══════════════ -->
    <div id="auth-page">
        <div class="page">

            <!-- Logo -->
            <div class="logo-wrap">
                <div class="logo-text">ColorChain</div>
                <div class="logo-sub">Chain your colors. Beat the game.</div>
            </div>

            <!-- Card -->
            <div class="card">
                <div class="tabs">
                    <button class="tab active" id="tab-signup">Sign up</button>
                    <button class="tab" id="tab-login">Log in</button>
                </div>

                <!-- Sign Up -->
                <div id="signup-form">
                    <div class="form-body">
                        <div class="field">
                            <label>Email</label>
                            <input type="email" id="signup-email" placeholder="you@example.com" autocomplete="email" />
                        </div>
                        <div class="field">
                            <label>Username</label>
                            <input type="text" id="signup-username" placeholder="Choose a username"
                                autocomplete="username" />
                        </div>
                        <div class="field">
                            <label>Password</label>
                            <input type="password" id="signup-password" placeholder="Min. 6 characters"
                                autocomplete="new-password" />
                        </div>
                        <button class="btn" id="signup-btn">Create Account</button>
                        <div class="divider">or</div>
                        <button class="btn-google" id="google-signup-btn">
                            <svg viewBox="0 0 48 48">
                                <path fill="#EA4335"
                                    d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z" />
                                <path fill="#4285F4"
                                    d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z" />
                                <path fill="#FBBC05"
                                    d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z" />
                                <path fill="#34A853"
                                    d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z" />
                            </svg>
                            Continue with Google
                        </button>
                    </div>
                </div>

                <!-- Log In -->
                <div id="login-form" style="display:none">
                    <div class="form-body">
                        <div class="field">
                            <label>Email</label>
                            <input type="email" id="login-email" placeholder="you@example.com" autocomplete="email" />
                        </div>
                        <div class="field">
                            <label>Password</label>
                            <input type="password" id="login-password" placeholder="Your password"
                                autocomplete="current-password" />
                        </div>
                        <button class="btn" id="login-btn">Log In</button>
                        <div class="divider">or</div>
                        <button class="btn-google" id="google-login-btn">
                            <svg viewBox="0 0 48 48">
                                <path fill="#EA4335"
                                    d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z" />
                                <path fill="#4285F4"
                                    d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z" />
                                <path fill="#FBBC05"
                                    d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z" />
                                <path fill="#34A853"
                                    d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z" />
                            </svg>
                            Continue with Google
                        </button>
                    </div>
                </div>

                <div id="auth-error"></div>
            </div>
            <!-- 
            <div class="footer-note">
                By continuing you agree to the <a href="#" style="color:var(--muted)">Terms of Service</a>
            </div> -->
        </div>
    </div>


    <!-- ═══════════════ GAME PAGE ═══════════════ -->
    <div id="game-page">

        <div class="g-logo">ColorChain</div>
        <div class="logo-sub" id="status">Press any key to start</div>
        <div id="board">
            <div class="game-btn red" data-color="red"></div>
            <div class="game-btn blue" data-color="blue"></div>
            <div class="game-btn orange" data-color="orange"></div>
            <div class="game-btn violet" data-color="violet"></div>
        </div>

        <!-- Leaderboard (sidebar, shown during game) -->

        <!-- Improved Start Button -->
        <button id="startBtn" class="btn">
            Start
        </button>

        <!-- User info — fixed bottom right (moved out of game-page flow) -->
        <div class="uid">uid: <span id="user-uid"></span></div>

    </div>

    <!-- User info block — fixed bottom right -->
    <div class="g-user" id="g-user-block" style="display:none">
        <div class="g-avatar" id="user-avatar">?</div>
        <div>
            <div class="g-name" id="user-name">Player</div>
            <div class="g-email" id="user-email"></div>
        </div>
        <button class="btn-out" id="logout-btn">Log out</button>
    </div>


    <!-- ═══════════════ GAME OVER OVERLAY ═══════════════ -->
    <div id="gameover-overlay">
        <div class="go-content">

            <!-- Left: modal card -->
            <div class="go-modal">

                <div class="go-icon">💀</div>
                <div class="go-title">Game Over</div>

                <!-- Score cards -->
                <div class="go-scores">
                    <div class="go-score-card">
                        <div class="go-score-label">Score</div>
                        <div class="go-score-value" id="go-score">0</div>
                    </div>
                    <div class="go-score-card best">
                        <div class="go-score-label">Best</div>
                        <div class="go-score-value" id="go-best">0</div>
                    </div>
                </div>

                <!-- Play Again -->
                <button id="go-play-again">
                    <span class="btn-inner">
                        <span class="btn-icon"></span>
                        Play Again
                    </span>
                </button>

            </div>

            <!-- Right: leaderboard panel -->
            <div class="go-side-lb">
                <div class="go-lb-title">Leaderboard</div>
                <ol class="go-lb-list" id="go-lb-list">
                    <!-- Populated by JS -->
                </ol>
            </div>

        </div>
    </div>


    <script type="module" src="app.js" defer></script>
    <script type="module" src="auth.js"></script>

    <script type="module" src="switch.js"></script>
    <script type="module" src="database.js"></script>
</body>

</html>
